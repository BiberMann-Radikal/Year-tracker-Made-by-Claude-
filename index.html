<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress Bars</title>
<style>
  /* ---- Edit these to restyle the widget ---- */
  :root {
    --ink: #3a3631;              /* bar outline, fill and text */
    --track: transparent;        /* empty part of the bar */
    --border: 4px;               /* outline thickness */
    --radius: 10px;
    --gap: 5px;                  /* space between outline and fill */
    --bar-h: min(11vh, 58px);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8e6e1; }
  }

  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    box-sizing: border-box;
    padding: 12px 16px;
    display: flex; flex-direction: column; justify-content: space-evenly;
    font-family: var(--font);
    color: var(--ink);
  }

  .row { display: flex; align-items: center; gap: 16px; }

  .bar {
    flex: 1; min-width: 0;
    height: var(--bar-h);
    box-sizing: border-box;
    border: var(--border) solid var(--ink);
    border-radius: var(--radius);
    padding: var(--gap);
    background: var(--track);
  }
  .fill {
    height: 100%;
    width: 0;
    min-width: 0;
    background: var(--ink);
    border-radius: calc(var(--radius) - var(--border) - 1px);
    transition: width 1.2s cubic-bezier(.2, .8, .2, 1);
  }

  .label {
    flex: 0 0 auto;
    width: 7.5em;
    font-size: clamp(13px, 3.6vw, 17px);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
  <div id="rows"></div>

<script>
  /* ---- Settings ---- */
  const WEEK_STARTS_ON_MONDAY = true;   // false = weeks start on Sunday
  // Order and names of the bars. Remove a line to hide a bar.
  const BARS = ["Year", "Month", "Week", "Day", "Quarter"];

  // Each function returns [start, end] dates for the current period.
  const periods = {
    Year:    n => [new Date(n.getFullYear(), 0, 1), new Date(n.getFullYear() + 1, 0, 1)],
    Month:   n => [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth() + 1, 1)],
    Week:    n => {
      const offset = WEEK_STARTS_ON_MONDAY ? (n.getDay() + 6) % 7 : n.getDay();
      const s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - offset);
      return [s, new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7)];
    },
    Day:     n => [new Date(n.getFullYear(), n.getMonth(), n.getDate()), new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1)],
    Quarter: n => {
      const q = Math.floor(n.getMonth() / 3) * 3;
      return [new Date(n.getFullYear(), q, 1), new Date(n.getFullYear(), q + 3, 1)];
    }
  };

  const container = document.getElementById("rows");
  const els = {};

  // Build the rows once
  BARS.forEach(name => {
    const row = document.createElement("div");
    row.className = "row";
    row.style.marginBlock = "0";
    row.innerHTML = '<div class="bar"><div class="fill"></div></div><div class="label"></div>';
    container.appendChild(row);
    els[name] = { fill: row.querySelector(".fill"), label: row.querySelector(".label") };
  });
  // Spread the rows evenly down the page
  container.style.cssText = "flex:1; display:flex; flex-direction:column; justify-content:space-evenly;";

  function update() {
    const now = new Date();
    BARS.forEach(name => {
      const [start, end] = periods[name](now);
      const pct = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
      els[name].fill.style.width = pct + "%";
      els[name].label.textContent = name + ": " + Math.round(pct) + "%";
    });
  }

  // Small delay so the bars animate in on first load
  requestAnimationFrame(() => setTimeout(update, 50));
  setInterval(update, 60 * 1000);
</script>
</body>
</html>
